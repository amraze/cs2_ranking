<div class="auth-container">
    <div class="container">
        <div class="logo-section">
            <h1>CS2 Ranking</h1>
            <p>Track your gaming performance</p>
        </div>

        <div class="auth-card">
            <div class="tab-switcher">
                <button class="tab-btn" [class.active]="isLogin" (click)="toggleMode()" type="button">
                    Login
                </button>
                <button class="tab-btn" [class.active]="!isLogin" (click)="toggleMode()" type="button">
                    Sign Up
                </button>
            </div>

            <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
                <div class="form-group" *ngIf="!isLogin">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" formControlName="username" placeholder="Choose a username"
                        [class.invalid]="submitted && f['username'].errors">
                    <div class="error-message" *ngIf="submitted && f['username'].errors">
                        <span *ngIf="f['username'].errors['required']">Username is required</span>
                        <span *ngIf="f['username'].errors['minlength']">Username must be at least 3 characters</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" formControlName="email" placeholder="Enter your email"
                        [class.invalid]="submitted && f['email'].errors">
                    <div class="error-message" *ngIf="submitted && f['email'].errors">
                        <span *ngIf="f['email'].errors['required']">Email is required</span>
                        <span *ngIf="f['email'].errors['email']">Please enter a valid email</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" formControlName="password"
                        placeholder="Enter your password" [class.invalid]="submitted && f['password'].errors">
                    <div class="error-message" *ngIf="submitted && f['password'].errors">
                        <span *ngIf="f['password'].errors['required']">Password is required</span>
                        <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
                    </div>
                </div>

                <div class="form-group" *ngIf="!isLogin">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-input" formControlName="confirmPassword"
                        placeholder="Confirm your password" [class.invalid]="submitted && f['confirmPassword'].errors">
                    <div class="error-message" *ngIf="submitted && f['confirmPassword'].errors">
                        <span *ngIf="f['confirmPassword'].errors['required']">Please confirm your password</span>
                        <span *ngIf="f['confirmPassword'].errors['passwordMismatch']">Passwords do not match</span>
                    </div>
                </div>

                <div class="forgot-password" *ngIf="isLogin">
                    <a href="javascript:void(0)" (click)="forgotPassword()">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    {{ isLogin ? 'Login' : 'Create Account' }}
                </button>
            </form>
        </div>
    </div>
</div>
