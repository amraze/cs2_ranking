<div class="sheets-link-section h-100">
    <div class="container top" [class.slideUp]="sheetHeaders.length">
        <div class="w-100 d-flex justify-content-center">
            <div class="col-md-6">
                <div class="section-title text-center w-100">
                    <h2>Import from Google Sheets</h2>
                    <p>Provide your Google Sheets link to fetch and import data seamlessly.</p>
                </div>
            </div>
        </div>

        <div class="w-100 d-flex justify-content-center">
            <div class="col-md-6 position-relative">
                <div class="text-danger position-absolute text-bold" style="top:-30px">{{error}}</div>
                <form (ngSubmit)="onSubmit(sheetLink.value)">
                    <input #sheetLink type="text" placeholder="Enter Google Sheets id" required>
                    <button type="submit">Import Data</button>
                </form>
            </div>
        </div>

    </div>

    <div class="container bottom" [class.slideUp]=" sheetHeaders.length">
        <div class="w-100 d-flex justify-content-center">
            <div class="row w-100">
                <div class="col-2"></div>
                <div class="col-4 align-items-center d-flex justify-content-center">
                    <div class="section-title text-center">
                        <h2 style="font-size:50px">{{sheetHeaders.length}}</h2>
                        <div class="text-secondary fs-5">headers extracted</div>
                    </div>
                </div>
                <div class="col-4 align-items-center d-flex justify-content-center">
                    <div class="section-title text-center">
                        <h2 style="font-size:50px">{{sheetRows.length}}</h2>
                        <div class="text-secondary fs-5">new matches found</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container bottom" [class.slideUp]="sheetHeaders.length">
        <div class="w-100 d-flex justify-content-center">
            <div class="row w-100">
                <div class="col-2"></div>
                <div class="col-4 align-items-center d-flex justify-content-center">
                    <div class="section-title text-center">
                        <h2 style="font-size:50px">{{sheetHeaders.length}}</h2>
                        <div class="text-secondary fs-5">headers extracted</div>
                    </div>
                </div>
                <div class="col-4 align-items-center d-flex justify-content-center">
                    <div class="section-title text-center">
                        <h2 style="font-size:50px">{{sheetRows.length}}</h2>
                        <div class="text-secondary fs-5">new matches found</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
