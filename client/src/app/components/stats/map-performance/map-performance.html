<div class="map_performance">
    <div class="map_performance--header card-header">
        MAP PERFORMANCE
    </div>
    <div class="map_performance--body">
        <div class="row">
            <div class="col-xl-6 col-xxl-3 mb-4 map" *ngFor="let map of maps">
                <div>
                    <img class="img-map" src="{{map.picturePath}}" alt="" width="100%">
                    <div>
                        <h3 class="py-2 m-0">{{map.name}}</h3>
                    </div>
                    <div class="container">
                        <div class="row">
                            <div class="fs-2 pb-0 col-6 text-start">
                                {{ mapPerformance[map.id]?.winRate != null
                                ? (mapPerformance[map.id].winRate | number:'1.1-1')
                                : '-'
                                }} %
                            </div>
                            <div class="fs-2 pb-0 col-6 text-end">
                                {{ mapPerformance[map.id]?.matches != null
                                ? mapPerformance[map.id].matches
                                : '-'
                                }}
                            </div>
                        </div>
                        <div class="row">
                            <div class="fs-5 text-secondary col-6 text-start" style="margin-top:-10px">win rate</div>
                            <div class="fs-5 text-secondary col-6 text-end" style="margin-top:-10px">matches</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
