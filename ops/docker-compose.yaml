version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cs2ranking-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-api:
    build:
      context: ../Main
      dockerfile: Dockerfile
    container_name: cs2ranking-main
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=${DB_SERVER};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      GoogleSheets__ApiKey: ${GOOGLESHEETS_APIKEY}
      ScopeGG__ScopeSessionId: ${SCOPE_SESSION_ID}
    ports:
      - "${MAIN_API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ../Microservices/CS2Ranking.Authentication
      dockerfile: Dockerfile
    container_name: cs2ranking-auth
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=${DB_SERVER};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    ports:
      - "${AUTH_SERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: cs2ranking-client
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      - main-api
      - auth-service

volumes:
  postgres_data: